[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhole-agent"
dynamic = ["version"]
description = "A GitHub growth agent with selectable kernels and a long-horizon single-agent evolution runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    # Python-Markdown's vendored upstream suite (stewardship/markdown-*)
    # imports yaml in test_apis.py; without it the repair fleet proof fails
    # on a fresh worktree venv.
    "pyyaml",
]

[project.scripts]
blackhole = "blackhole_agent.cli:app"
blackhole-agent = "blackhole_agent.cli:app"
blackhole-supervisor = "blackhole_agent.supervisor:app"
blackhole-unbound = "blackhole_agent.unbound:app"

[tool.setuptools.dynamic]
version = {attr = "blackhole_agent.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["blackhole_agent*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored third-party trees are digest-sealed snapshots, not project code:
# linting them would both flag foreign style and litter them with .ruff_cache,
# breaking their vendored tree digests.
extend-exclude = ["capabilities/absorbed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: end-to-end plane campaigns that re-run full repair/benchmark cycles",
]
